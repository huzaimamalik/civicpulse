name: CD

on:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    name: CD test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TRIAGE_PROVIDER: simulated
      RUN_REAL_REDIS_TESTS: '1'
      # Must match backend/tests/test_redis_cache_layer.py until Partner A changes it.
      DATABASE_URL: postgresql+psycopg://postgres:${{ secrets.CI_POSTGRES_PASSWORD }}@localhost:5432/civicpulse
      REDIS_URL: redis://localhost:6379/0
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: civicpulse
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d civicpulse"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt ruff==0.16.9 mypy==2.3.1
        working-directory: backend
      - run: ruff check app
        working-directory: backend
      - run: mypy app
        working-directory: backend
      - run: alembic upgrade head
        working-directory: backend
      - run: pytest --cov=app --cov-report=term-missing --cov-fail-under=65
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - name: Install manifest tools
        run: |
          curl -fsSL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.1/kustomize_v5.8.1_linux_amd64.tar.gz -o "$RUNNER_TEMP/kustomize.tar.gz"
          tar -xzf "$RUNNER_TEMP/kustomize.tar.gz" -C "$RUNNER_TEMP" kustomize
          sudo install "$RUNNER_TEMP/kustomize" /usr/local/bin/kustomize
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz -o "$RUNNER_TEMP/kubeconform.tar.gz"
          tar -xzf "$RUNNER_TEMP/kubeconform.tar.gz" -C "$RUNNER_TEMP" kubeconform
          sudo install "$RUNNER_TEMP/kubeconform" /usr/local/bin/kubeconform
      - name: Validate the production overlay
        # VPA receives server-side validation in deploy-k8s; all core kinds are checked here.
        run: kustomize build k8s/overlays/prod | kubeconform -strict -summary -kubernetes-version 1.32.0 -skip VerticalPodAutoscaler
      - name: Retest the Compose request path
        env:
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
          DATABASE_URL: postgresql+psycopg://civicpulse:${{ secrets.CI_POSTGRES_PASSWORD }}@postgres:5432/civicpulse
          REDIS_URL: redis://redis:6379/0
          SMOKE_URL: http://localhost:8080
        run: |
          docker compose up --build -d --wait --wait-timeout 180
          curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 2 --retry-max-time 120 --max-time 5 http://localhost:8000/ready
          docker compose exec -T backend alembic upgrade head
          python .github/scripts/smoke.py
      - name: Clean up Compose
        if: always()
        env:
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
          DATABASE_URL: postgresql+psycopg://civicpulse:${{ secrets.CI_POSTGRES_PASSWORD }}@postgres:5432/civicpulse
          REDIS_URL: redis://redis:6379/0
        run: docker compose down -v

  build-push:
    name: CD build-push
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      backend-image: ${{ steps.images.outputs.backend }}
      frontend-image: ${{ steps.images.outputs.frontend }}
      backend-digest: ${{ steps.publish.outputs.backend-digest }}
      frontend-digest: ${{ steps.publish.outputs.frontend-digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Derive lowercase GHCR repositories
        id: images
        run: |
          echo "backend=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/civicpulse-backend" >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/civicpulse-frontend" >> "$GITHUB_OUTPUT"
      - name: Build both images
        env:
          BACKEND_IMAGE: ${{ steps.images.outputs.backend }}
          FRONTEND_IMAGE: ${{ steps.images.outputs.frontend }}
        run: |
          docker build --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" -t "$BACKEND_IMAGE:$GITHUB_SHA" ./backend
          docker build --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" -t "$FRONTEND_IMAGE:$GITHUB_SHA" ./frontend
      - name: Install Trivy 0.74.0 and Syft 1.52.0
        run: |
          curl -fsSL https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz -o "$RUNNER_TEMP/trivy.tar.gz"
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP" trivy
          sudo install "$RUNNER_TEMP/trivy" /usr/local/bin/trivy
          curl -fsSL https://github.com/anchore/syft/releases/download/v1.52.0/syft_1.52.0_linux_amd64.tar.gz -o "$RUNNER_TEMP/syft.tar.gz"
          tar -xzf "$RUNNER_TEMP/syft.tar.gz" -C "$RUNNER_TEMP" syft
          sudo install "$RUNNER_TEMP/syft" /usr/local/bin/syft
      - name: Scan both images before any push
        env:
          BACKEND_IMAGE: ${{ steps.images.outputs.backend }}
          FRONTEND_IMAGE: ${{ steps.images.outputs.frontend }}
        run: |
          trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$BACKEND_IMAGE:$GITHUB_SHA"
          trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$FRONTEND_IMAGE:$GITHUB_SHA"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push SHA and latest tags and capture digests
        id: publish
        env:
          BACKEND_IMAGE: ${{ steps.images.outputs.backend }}
          FRONTEND_IMAGE: ${{ steps.images.outputs.frontend }}
        run: |
          for component in backend frontend; do
            if [ "$component" = backend ]; then image="$BACKEND_IMAGE"; else image="$FRONTEND_IMAGE"; fi
            docker push "$image:$GITHUB_SHA"
            docker tag "$image:$GITHUB_SHA" "$image:latest"
            docker push "$image:latest"
            reference=$(docker image inspect --format '{{index .RepoDigests 0}}' "$image:$GITHUB_SHA")
            digest="${reference##*@}"
            test "${digest#sha256:}" != "$digest"
            echo "$component-digest=$digest" >> "$GITHUB_OUTPUT"
          done
      - name: Emit Syft SBOMs for the published images
        env:
          BACKEND_IMAGE: ${{ steps.images.outputs.backend }}
          FRONTEND_IMAGE: ${{ steps.images.outputs.frontend }}
        run: |
          syft "registry:$BACKEND_IMAGE:$GITHUB_SHA" -o "spdx-json=$RUNNER_TEMP/backend.spdx.json"
          syft "registry:$FRONTEND_IMAGE:$GITHUB_SHA" -o "spdx-json=$RUNNER_TEMP/frontend.spdx.json"
      - name: Retain the two SBOMs
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ github.sha }}
          path: ${{ runner.temp }}/*.spdx.json
          if-no-files-found: error

  deploy-k8s:
    name: CD deploy-k8s
    needs: build-push
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    env:
      BACKEND_IMAGE: ${{ needs.build-push.outputs.backend-image }}
      FRONTEND_IMAGE: ${{ needs.build-push.outputs.frontend-image }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install k3d and Kustomize
        run: |
          curl -fsSL https://github.com/k3d-io/k3d/releases/download/v5.9.0/k3d-linux-amd64 -o "$RUNNER_TEMP/k3d"
          sudo install "$RUNNER_TEMP/k3d" /usr/local/bin/k3d
          curl -fsSL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.1/kustomize_v5.8.1_linux_amd64.tar.gz -o "$RUNNER_TEMP/kustomize.tar.gz"
          tar -xzf "$RUNNER_TEMP/kustomize.tar.gz" -C "$RUNNER_TEMP" kustomize
          sudo install "$RUNNER_TEMP/kustomize" /usr/local/bin/kustomize
      - name: Create the ephemeral cluster
        run: |
          k3d cluster create civicpulse --image rancher/k3s:v1.32.5-k3s1 --port '8080:80@loadbalancer' --wait --timeout 180s
          # Use the cluster's matching kubectl, not a potentially incompatible runner client.
          k3d kubeconfig get civicpulse > "$RUNNER_TEMP/civicpulse-kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/civicpulse-kubeconfig" >> "$GITHUB_ENV"
          curl -fsSL https://dl.k8s.io/release/v1.32.5/bin/linux/amd64/kubectl -o "$RUNNER_TEMP/kubectl"
          sudo install "$RUNNER_TEMP/kubectl" /usr/local/bin/kubectl
      - name: Verify bundled Ingress and resource metrics
        run: |
          kubectl wait -n kube-system --for=create job/helm-install-traefik --timeout=180s
          kubectl wait -n kube-system --for=condition=complete job/helm-install-traefik --timeout=180s
          kubectl rollout status -n kube-system deployment/traefik --timeout=180s
          kubectl rollout status -n kube-system deployment/metrics-server --timeout=180s
          kubectl wait --for=condition=Available apiservice/v1beta1.metrics.k8s.io --timeout=180s
          kubectl annotate ingressclass traefik ingressclass.kubernetes.io/is-default-class=true --overwrite
      - name: Install official VPA CRDs, RBAC, and recommender
        # Off mode needs recommendations only, with no updater or admission webhook.
        run: |
          vpa=https://raw.githubusercontent.com/kubernetes/autoscaler/vertical-pod-autoscaler-1.6.0/vertical-pod-autoscaler/deploy
          kubectl apply --server-side -f "$vpa/vpa-v1-crd-gen.yaml"
          kubectl wait --for=condition=Established crd/verticalpodautoscalers.autoscaling.k8s.io --timeout=60s
          kubectl apply -f "$vpa/vpa-rbac.yaml"
          kubectl apply -f "$vpa/recommender-deployment.yaml"
          kubectl rollout status -n kube-system deployment/vpa-recommender --timeout=180s
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull and import the published SHA images without rebuilding
        run: |
          docker pull "$BACKEND_IMAGE:$GITHUB_SHA"
          docker pull "$FRONTEND_IMAGE:$GITHUB_SHA"
          k3d image import "$BACKEND_IMAGE:$GITHUB_SHA" "$FRONTEND_IMAGE:$GITHUB_SHA" --cluster civicpulse
      - name: Prepare production configuration outside the checkout
        env:
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
        run: |
          cp -R k8s "$RUNNER_TEMP/civicpulse-k8s"
          cd "$RUNNER_TEMP/civicpulse-k8s/overlays/prod"
          kustomize edit set image "civicpulse-backend=$BACKEND_IMAGE:$GITHUB_SHA" "civicpulse-frontend=$FRONTEND_IMAGE:$GITHUB_SHA"
          # Replace only the temporary placeholder Secret before any workloads start.
          # The current Alembic config requires a URL-safe password without percent escapes.
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          password = os.environ["POSTGRES_PASSWORD"]
          if not re.fullmatch(r"[A-Za-z0-9_-]+", password):
              raise SystemExit("CI_POSTGRES_PASSWORD must be nonempty and URL-safe")
          secret = {
              "apiVersion": "v1", "kind": "Secret",
              "metadata": {"name": "civicpulse-secrets"}, "type": "Opaque",
              "stringData": {
                  "POSTGRES_PASSWORD": password,
                  "DATABASE_URL": f"postgresql+psycopg://civicpulse:{password}@postgres:5432/civicpulse",
                  "GROQ_API_KEY": "", "GEMINI_API_KEY": "",
              },
          }
          path = Path("../../base/secret.yaml")
          path.write_text(json.dumps(secret))
          path.chmod(0o600)
          PY
      - name: Apply the production overlay
        # Never print the rendered Secret. The existing host is used by the smoke Host header.
        run: kustomize build "$RUNNER_TEMP/civicpulse-k8s/overlays/prod" | kubectl apply --server-side -f -
      - name: Wait for application workloads
        run: |
          kubectl rollout status -n civicpulse statefulset/postgres --timeout=180s
          kubectl rollout status -n civicpulse deployment/redis --timeout=180s
          kubectl rollout status -n civicpulse deployment/backend --timeout=180s
          kubectl rollout status -n civicpulse deployment/frontend --timeout=180s
      - name: Apply Alembic migrations
        run: kubectl exec -n civicpulse deployment/backend -- alembic upgrade head
      - name: Smoke test frontend and API through Ingress
        env:
          SMOKE_URL: http://localhost:8080
          SMOKE_HOST: civicpulse.example.invalid
        run: |
          curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 2 --retry-max-time 120 --max-time 5 -H "Host: $SMOKE_HOST" "$SMOKE_URL/" -o "$RUNNER_TEMP/frontend.html"
          grep -q 'id="root"' "$RUNNER_TEMP/frontend.html"
          python .github/scripts/smoke.py
      - name: Show HPA status
        run: kubectl get hpa -n civicpulse
      - name: Delete the ephemeral cluster and temporary secrets
        if: always()
        run: |
          if command -v k3d >/dev/null; then k3d cluster delete civicpulse; fi
          rm -f "$RUNNER_TEMP/civicpulse-k8s/base/secret.yaml" "$RUNNER_TEMP/civicpulse-kubeconfig"
