name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Release test
    runs-on: ubuntu-24.04
    env:
      TRIAGE_PROVIDER: simulated
      RUN_REAL_REDIS_TESTS: '1'
      # Must match the current real Redis test fixture's local PostgreSQL URL.
      DATABASE_URL: postgresql+psycopg://postgres:${{ secrets.CI_POSTGRES_PASSWORD }}@localhost:5432/civicpulse
      REDIS_URL: redis://localhost:6379/0
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: civicpulse
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d civicpulse"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Require a Docker-compatible semantic version tag
        # A v* trigger also matches non-versions. Reject those before publication.
        run: |
          python - <<'PY'
          import os
          import re

          number = r"(?:0|[1-9][0-9]*)"
          identifier = r"(?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)"
          pattern = rf"v{number}\.{number}\.{number}(?:-{identifier}(?:\.{identifier})*)?"
          tag = os.environ["GITHUB_REF_NAME"]
          if len(tag) > 128 or not re.fullmatch(pattern, tag):
              raise SystemExit("Use vMAJOR.MINOR.PATCH, optionally with a prerelease; Docker tags cannot contain + metadata")
          PY
      - run: python -m pip install -r requirements.txt ruff==0.16.9 mypy==2.3.1
        working-directory: backend
      - run: ruff check app
        working-directory: backend
      - run: mypy app
        working-directory: backend
      - run: alembic upgrade head
        working-directory: backend
      - run: pytest --cov=app --cov-report=term-missing --cov-fail-under=65
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm test
        working-directory: frontend

  build-push:
    name: Release build-push
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Derive lowercase GHCR repositories
        run: |
          echo "BACKEND_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/civicpulse-backend" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/civicpulse-frontend" >> "$GITHUB_ENV"
      - name: Build the exact release tag
        run: |
          docker build --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" -t "$BACKEND_IMAGE:$GITHUB_REF_NAME" ./backend
          docker build --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" -t "$FRONTEND_IMAGE:$GITHUB_REF_NAME" ./frontend
      - name: Install Trivy 0.74.0
        run: |
          curl -fsSL https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz -o "$RUNNER_TEMP/trivy.tar.gz"
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP" trivy
          sudo install "$RUNNER_TEMP/trivy" /usr/local/bin/trivy
      - name: Scan both images before any push
        run: |
          trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$BACKEND_IMAGE:$GITHUB_REF_NAME"
          trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$FRONTEND_IMAGE:$GITHUB_REF_NAME"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish semantic version images
        run: |
          docker push "$BACKEND_IMAGE:$GITHUB_REF_NAME"
          docker push "$FRONTEND_IMAGE:$GITHUB_REF_NAME"

  release-notes:
    name: Release notes
    needs: build-push
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Create the release with GitHub-generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen

          tag = os.environ["GITHUB_REF_NAME"]
          payload = {
              "tag_name": tag,
              "generate_release_notes": True,
              "prerelease": "-" in tag,
          }
          request = Request(
              f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/releases",
              data=json.dumps(payload).encode(),
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          with urlopen(request, timeout=30) as response:
              assert response.status == 201
              print(json.load(response)["html_url"])
          PY
