apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
# Build with the existing Dockerfiles and load these images into the local cluster.
images:
  - name: civicpulse-backend
    newTag: dev
  - name: civicpulse-frontend
    newTag: dev
patches:
  - target:
      kind: Ingress
      name: civicpulse
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: civicpulse.local
