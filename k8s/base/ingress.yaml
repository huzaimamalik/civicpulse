apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: civicpulse
spec:
  # Requires a default IngressClass on the local cluster; no controller is bundled.
  rules:
    - host: civicpulse.example.invalid
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 8080
# No rewrite: the backend owns /api/complaints and the other /api routes.
