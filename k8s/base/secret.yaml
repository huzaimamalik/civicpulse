apiVersion: v1
kind: Secret
metadata:
  name: civicpulse-secrets
type: Opaque
# Placeholders only. Inject real values outside tracked manifests before deployment.
# Keep DATABASE_URL credentials in sync with POSTGRES_* in this Secret and ConfigMap.
# Use a URL-safe database password for the current Alembic configuration.
stringData:
  POSTGRES_PASSWORD: replace-me
  DATABASE_URL: postgresql+psycopg://civicpulse:replace-me@postgres:5432/civicpulse
  # Reserved by the shared contract; the current simulated provider ignores these.
  GROQ_API_KEY: replace-with-groq-api-key
  GEMINI_API_KEY: replace-with-gemini-api-key
